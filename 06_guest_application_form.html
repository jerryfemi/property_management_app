<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form - PropTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#1B4FD8', accent: '#10B981', background: '#F8FAFC', surface: '#FFFFFF', dark: '#0F172A', muted: '#64748B', danger: '#EF4444', warning: '#F59E0B' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="max-w-[390px] w-full h-[844px] bg-surface relative shadow-2xl overflow-hidden flex flex-col">
        <!-- Header & Progress -->
        <div class="px-6 pt-12 pb-4 border-b border-gray-100">
            <div class="flex items-center gap-4 mb-6">
                <button class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-50 hover:bg-gray-100 transition-colors">
                    <svg class="w-5 h-5 text-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <div>
                    <h1 class="text-xl font-bold text-dark">Rental Application</h1>
                    <p class="text-xs text-muted font-medium">Unit 2A • Lekki Gardens</p>
                </div>
            </div>
            
            <div class="flex justify-between items-center relative">
                <div class="absolute top-1/2 left-0 right-0 h-1 bg-gray-100 -translate-y-1/2 rounded-full z-0"></div>
                <div class="absolute top-1/2 left-0 w-[45%] h-1 bg-primary -translate-y-1/2 rounded-full z-0 transition-all duration-500"></div>
                
                <div class="relative z-10 flex flex-col items-center gap-1">
                    <div class="w-6 h-6 rounded-full bg-primary text-white flex items-center justify-center text-xs font-bold shadow-sm"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></div>
                    <span class="text-[10px] font-bold text-primary">Personal</span>
                </div>
                <div class="relative z-10 flex flex-col items-center gap-1">
                    <div class="w-6 h-6 rounded-full bg-primary text-white flex items-center justify-center text-xs font-bold shadow-sm ring-4 ring-primary/20">2</div>
                    <span class="text-[10px] font-bold text-primary">Identity</span>
                </div>
                <div class="relative z-10 flex flex-col items-center gap-1">
                    <div class="w-6 h-6 rounded-full bg-white border-2 border-gray-200 text-gray-400 flex items-center justify-center text-xs font-bold">3</div>
                    <span class="text-[10px] font-medium text-muted">Income</span>
                </div>
                <div class="relative z-10 flex flex-col items-center gap-1">
                    <div class="w-6 h-6 rounded-full bg-white border-2 border-gray-200 text-gray-400 flex items-center justify-center text-xs font-bold">4</div>
                    <span class="text-[10px] font-medium text-muted">Guarantor</span>
                </div>
            </div>
        </div>

        <!-- Form Content -->
        <div class="flex-1 px-6 py-8 overflow-y-auto pb-24">
            <h2 class="text-2xl font-bold text-dark mb-2 tracking-tight">Identity Verification</h2>
            <p class="text-sm text-muted mb-8 leading-relaxed">Please upload a clear picture of your valid government-issued ID card.</p>

            <form class="space-y-6">
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-dark">ID Type</label>
                    <div class="relative">
                        <select class="w-full px-4 py-4 bg-background border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary appearance-none text-dark font-medium">
                            <option>National ID (NIN)</option>
                            <option>International Passport</option>
                            <option>Driver's License</option>
                            <option>Voter's Card</option>
                        </select>
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
                            <svg class="w-5 h-5 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-semibold text-dark">Upload Document</label>
                    <div class="border-2 border-dashed border-primary/30 bg-primary/5 rounded-2xl p-8 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-primary/10 transition-colors group">
                        <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-4 shadow-sm group-hover:scale-110 transition-transform">
                            <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        </div>
                        <h3 class="text-sm font-bold text-primary mb-1">Tap to upload file</h3>
                        <p class="text-xs text-muted">JPEG, PNG or PDF (Max 5MB)</p>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-semibold text-dark">ID Number</label>
                    <input type="text" class="w-full px-4 py-4 bg-background border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary font-medium text-dark" placeholder="Enter ID number">
                </div>
            </form>
        </div>

        <!-- Footer -->
        <div class="absolute bottom-0 left-0 right-0 p-6 bg-surface border-t border-gray-100 flex gap-4">
            <button class="px-6 py-4 rounded-xl border border-gray-200 text-dark font-semibold hover:bg-gray-50 transition-colors">Back</button>
            <button class="flex-1 bg-primary text-white font-bold py-4 rounded-xl hover:bg-primary/90 transition-colors shadow-lg shadow-primary/25">Continue to Income</button>
        </div>
    </div>
</body>
</html>
