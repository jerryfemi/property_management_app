<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Maintenance - PropTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#1B4FD8', accent: '#10B981', background: '#F8FAFC', surface: '#FFFFFF', dark: '#0F172A', muted: '#64748B', danger: '#EF4444', warning: '#F59E0B' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="max-w-[390px] w-full h-[844px] bg-surface relative shadow-2xl flex flex-col">
        <!-- Header -->
        <div class="px-6 pt-14 pb-4 border-b border-gray-100 flex items-center gap-4">
            <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors">
                <svg class="w-6 h-6 text-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <h1 class="text-xl font-bold text-dark">Raise a Ticket</h1>
        </div>

        <div class="flex-1 overflow-y-auto px-6 py-6 pb-24">
            <form class="space-y-6">
                <!-- Category -->
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-dark">Issue Category</label>
                    <div class="relative">
                        <select class="w-full px-4 py-4 bg-background border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary appearance-none text-dark font-medium">
                            <option value="" disabled selected>Select a category</option>
                            <option>Plumbing</option>
                            <option>Electrical</option>
                            <option>Appliance</option>
                            <option>Structural</option>
                            <option>Other</option>
                        </select>
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
                            <svg class="w-5 h-5 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <!-- Description -->
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-dark">Description</label>
                    <textarea rows="4" class="w-full px-4 py-4 bg-background border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary text-dark placeholder-muted resize-none" placeholder="Please describe the issue in detail..."></textarea>
                </div>

                <!-- Priority -->
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-dark">Priority Level</label>
                    <div class="flex gap-3">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="priority" class="peer sr-only">
                            <div class="text-center py-3 bg-background border border-gray-200 rounded-xl peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-primary font-medium text-sm text-muted transition-colors">Low</div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="priority" class="peer sr-only" checked>
                            <div class="text-center py-3 bg-background border border-gray-200 rounded-xl peer-checked:bg-warning/10 peer-checked:border-warning peer-checked:text-warning font-bold text-sm text-muted transition-colors">Medium</div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="priority" class="peer sr-only">
                            <div class="text-center py-3 bg-background border border-gray-200 rounded-xl peer-checked:bg-danger/10 peer-checked:border-danger peer-checked:text-danger font-bold text-sm text-muted transition-colors">High</div>
                        </label>
                    </div>
                </div>

                <!-- Photos -->
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-dark">Add Photos</label>
                    <div class="flex gap-3">
                        <!-- Add Button -->
                        <div class="w-20 h-20 bg-background border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center text-muted cursor-pointer hover:border-primary hover:text-primary transition-colors">
                            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                            <span class="text-[10px] font-medium">Add</span>
                        </div>
                        <!-- Uploaded Photo placeholder -->
                        <div class="w-20 h-20 bg-gray-200 rounded-xl relative overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1585704032915-c3400ca199e7?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" class="w-full h-full object-cover">
                            <button type="button" class="absolute -top-1 -right-1 w-5 h-5 bg-danger text-white rounded-full flex items-center justify-center m-2 shadow">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <div class="absolute bottom-0 left-0 right-0 p-6 bg-surface border-t border-gray-100">
            <button class="w-full bg-primary text-white font-bold py-4 rounded-xl hover:bg-primary/90 transition-colors shadow-lg shadow-primary/25">
                Submit Ticket
            </button>
        </div>
    </div>
</body>
</html>
