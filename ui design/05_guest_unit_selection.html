<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Selection - PropTech</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Light Theme Tokens */
            --primary: #1B4FD8;
            --primary-hover: #153fb0;
            --primary-light: #EEF2FF;
            --primary-alpha: rgba(27, 79, 216, 0.1);
            --accent: #10B981;
            --accent-light: #ECFDF5;
            --danger: #EF4444;
            --danger-light: #FEF2F2;
            --warning: #F59E0B;
            --warning-light: #FFFBEB;
            --background: #F1F5F9;
            --surface: #FFFFFF;
            --surface-alpha: rgba(255, 255, 255, 0.85);
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --border-hover: #CBD5E1;
            --tag-bg: #F8FAFC;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #1B4FD8;
                --primary-hover: #3364e0;
                --primary-light: #233B74;
                --primary-alpha: rgba(27, 79, 216, 0.2);
                --accent: #10B981;
                --accent-light: #064E3B;
                --danger: #EF4444;
                --danger-light: #7F1D1D;
                --warning: #F59E0B;
                --warning-light: #78350F;
                --background: #09090B;
                --surface: #171717;
                --surface-alpha: rgba(23, 23, 23, 0.85);
                --text-main: #E5E7EB;
                --text-muted: #94A3B8;
                --border: #262626;
                --border-hover: #404040;
                --tag-bg: #262626;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Darker backdrop to make the app pop */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            height: 850px;
            max-height: 95vh;
            background-color: var(--background);
            position: relative;
            border-radius: 36px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), inset 0 0 0 8px #000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: var(--surface-alpha);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 3.5rem 1.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border-bottom: 1px solid var(--border);
            z-index: 10;
            position: sticky;
            top: 0;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: var(--background);
            transform: scale(1.05);
        }

        .header-title {
            display: flex;
            flex-direction: column;
        }

        .header-title h1 {
            font-size: 1.125rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .header-title p {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 2px;
        }

        /* Scroll Area */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            padding-bottom: 9rem; /* extra space for bottom bar */
        }
        
        .content::-webkit-scrollbar { display: none; }
        .content { -ms-overflow-style: none; scrollbar-width: none; }

        /* Floor Plan Card */
        .floor-plan-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 1.25rem;
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .floor-plan-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .card-header h2 {
            font-size: 0.875rem;
            font-weight: 700;
        }

        .expand-btn {
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: none;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .expand-btn:hover { opacity: 0.8; }

        .floor-plan-img {
            background: var(--primary-alpha);
            border: 1px dashed var(--primary);
            border-radius: 12px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            margin-bottom: 1.25rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .floor-plan-img::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 3s infinite;
        }

        @media (prefers-color-scheme: dark) {
            .floor-plan-img::after {
                background: linear-gradient(to right, transparent, rgba(255,255,255,0.05), transparent);
            }
        }

        @keyframes shimmer {
            100% { left: 200%; }
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .val {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .stat-item .lbl {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 2px;
        }

        .stat-divider {
            width: 1px;
            height: 24px;
            background: var(--border);
        }

        /* Units Selection */
        .section-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .unit-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .unit-option {
            display: block;
            cursor: pointer;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .unit-option input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .unit-card {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 1.25rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .unit-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .unit-option input:checked + .unit-card {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-alpha);
            background: var(--surface);
        }

        .unit-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .unit-info-wrap {
            display: flex;
            gap: 0.875rem;
            align-items: center;
        }

        .unit-avatar {
            width: 44px;
            height: 44px;
            background: var(--background);
            color: var(--text-main);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 800;
            transition: all 0.3s;
        }

        .unit-option input:checked + .unit-card .unit-avatar {
            background: var(--primary);
            color: #ffffff;
        }

        .unit-details h4 {
            font-size: 0.9375rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .unit-details p {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Custom Radio */
        .radio-circle {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--border-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .radio-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            transform: scale(0);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .unit-option input:checked + .unit-card .radio-circle {
            border-color: var(--primary);
        }

        .unit-option input:checked + .unit-card .radio-dot {
            transform: scale(1);
        }

        .unit-card-bottom {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag {
            background: var(--tag-bg);
            color: var(--text-main);
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .unit-option input:checked + .unit-card .tag {
            background: var(--primary-alpha);
            color: var(--primary);
        }

        .price {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-main);
            transition: color 0.3s;
        }
        
        .unit-option input:checked + .unit-card .price {
            color: var(--primary);
        }

        /* Sticky Bottom Bar */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem;
            background: var(--surface-alpha);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            z-index: 20;
            border-radius: 0 0 32px 32px;
        }

        .selection-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .selection-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        
        .selection-label span {
            color: var(--text-main);
            font-weight: 700;
            margin-left: 4px;
        }

        .selection-price {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            transition: transform 0.2s, color 0.2s;
        }

        .selection-price span {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .btn-apply {
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 1.125rem;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(27, 79, 216, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-apply:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(27, 79, 216, 0.5);
        }

        .btn-apply:active {
            transform: translateY(1px);
        }

        .btn-apply::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.3s, transform 0.3s;
        }

        .btn-apply:hover::after {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <button class="back-btn" aria-label="Go back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>
            <div class="header-title">
                <h1>1 Bedroom Units</h1>
                <p>Lekki Gardens Estate</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="content">
            <!-- Floor Plan Card -->
            <section class="floor-plan-card">
                <div class="card-header">
                    <h2>Floor Plan</h2>
                    <button class="expand-btn">Expand</button>
                </div>
                
                <div class="floor-plan-img">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16v16H4z"/>
                        <path d="M4 12h16"/>
                        <path d="M12 4v16"/>
                    </svg>
                </div>

                <div class="stats-row">
                    <div class="stat-item">
                        <div class="val">1</div>
                        <div class="lbl">Bed</div>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                        <div class="val">1</div>
                        <div class="lbl">Bath</div>
                    </div>
                </div>
            </section>

            <!-- Unit Selection -->
            <h3 class="section-title">Select a specific unit</h3>
            <div class="unit-list">
                <!-- Unit A1 -->
                <label class="unit-option">
                    <input type="radio" name="unit" value="A1" checked onchange="updateSelection('A1', '₦2.5M')">
                    <div class="unit-card">
                        <div class="unit-card-top">
                            <div class="unit-info-wrap">
                                <div class="unit-avatar">A1</div>
                                <div class="unit-details">
                                    <h4>Unit A1</h4>
                                </div>
                            </div>
                            <div class="radio-circle"><div class="radio-dot"></div></div>
                        </div>
                        <div class="unit-card-bottom">
                            <div class="tags">
                                <span class="tag">balcony</span>
                                <span class="tag">ac</span>
                            </div>
                            <div class="price">₦2.5M</div>
                        </div>
                    </div>
                </label>

                <!-- Unit A2 -->
                <label class="unit-option">
                    <input type="radio" name="unit" value="A2" onchange="updateSelection('A2', '₦2.5M')">
                    <div class="unit-card">
                        <div class="unit-card-top">
                            <div class="unit-info-wrap">
                                <div class="unit-avatar">A2</div>
                                <div class="unit-details">
                                    <h4>Unit A2</h4>
                                </div>
                            </div>
                            <div class="radio-circle"><div class="radio-dot"></div></div>
                        </div>
                        <div class="unit-card-bottom">
                            <div class="tags">
                                <span class="tag">balcony</span>
                                <span class="tag">ac</span>
                            </div>
                            <div class="price">₦2.5M</div>
                        </div>
                    </div>
                </label>
            </div>
        </main>

        <!-- Bottom Action Bar -->
        <div class="bottom-bar">
            <div class="selection-summary">
                <div class="selection-label">Selected: <span id="selected-unit-label">A1</span></div>
                <div class="selection-price" id="selected-unit-price-container">
                    <div id="selected-unit-price">₦2.5M</div>
                    <span>Base Rent</span>
                </div>
            </div>
            <button class="btn-apply">Apply Now</button>
        </div>
    </div>

    <script>
        function updateSelection(unit, price) {
            document.getElementById('selected-unit-label').innerText = unit;
            document.getElementById('selected-unit-price').innerText = price;
            
            // Add a subtle animation to the price when changing
            const priceContainer = document.getElementById('selected-unit-price-container');
            priceContainer.style.transform = 'scale(1.05)';
            priceContainer.style.color = 'var(--primary)';
            
            setTimeout(() => {
                priceContainer.style.transform = 'scale(1)';
                priceContainer.style.color = 'var(--text-main)';
            }, 200);
        }
    </script>
</body>
</html>
