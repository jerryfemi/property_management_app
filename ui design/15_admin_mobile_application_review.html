<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Review - PropTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#1B4FD8', accent: '#10B981', background: '#F8FAFC', surface: '#FFFFFF', dark: '#0F172A', muted: '#64748B', danger: '#EF4444', warning: '#F59E0B' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="max-w-[390px] w-full h-[844px] bg-background relative shadow-2xl flex flex-col">
        <!-- Header -->
        <div class="bg-surface px-6 pt-14 pb-4 shadow-sm z-10 flex items-center gap-4">
            <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors">
                <svg class="w-6 h-6 text-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <h1 class="text-lg font-bold text-dark">Review Application</h1>
        </div>

        <div class="flex-1 overflow-y-auto px-6 py-6 space-y-6 pb-32">
            <!-- Applicant Info -->
            <div class="flex items-center gap-4 bg-surface p-4 rounded-2xl shadow-sm border border-gray-100">
                <div class="w-16 h-16 rounded-full bg-primary/10 text-primary flex items-center justify-center text-xl font-bold">
                    KO
                </div>
                <div>
                    <h2 class="text-lg font-bold text-dark">Kemi Olayinka</h2>
                    <p class="text-sm text-muted">Applied for: Unit 2A</p>
                </div>
            </div>

            <!-- ID Document -->
            <div>
                <h3 class="text-sm font-bold text-dark mb-3">Identity Document</h3>
                <div class="bg-surface rounded-2xl p-2 shadow-sm border border-gray-100">
                    <div class="bg-gray-100 rounded-xl h-40 flex flex-col items-center justify-center relative overflow-hidden group cursor-pointer">
                        <img src="https://images.unsplash.com/photo-1633332755192-727a05c4013d?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="ID Document" class="w-full h-full object-cover opacity-50 blur-sm group-hover:blur-none transition-all">
                        <div class="absolute inset-0 flex flex-col items-center justify-center text-dark font-bold group-hover:opacity-0 transition-opacity">
                            <svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            Tap to view ID
                        </div>
                    </div>
                    <div class="p-3 flex justify-between items-center">
                        <div>
                            <p class="text-xs font-bold text-dark">National ID (NIN)</p>
                            <p class="text-[10px] text-muted">Verified via Third-party API</p>
                        </div>
                        <span class="w-6 h-6 rounded-full bg-accent/20 text-accent flex items-center justify-center"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></span>
                    </div>
                </div>
            </div>

            <!-- Financials -->
            <div>
                <h3 class="text-sm font-bold text-dark mb-3">Financial Overview</h3>
                <div class="bg-surface rounded-2xl p-4 shadow-sm border border-gray-100 space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-medium text-muted">Stated Income</span>
                        <span class="font-bold text-dark">₦12,000,000 / yr</span>
                    </div>
                    <div class="h-px bg-gray-100 w-full"></div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-medium text-muted">Rent to Income Ratio</span>
                        <span class="px-2 py-1 bg-accent/10 text-accent font-bold text-xs rounded">20.8% (Healthy)</span>
                    </div>
                    <div class="h-px bg-gray-100 w-full"></div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-medium text-muted">Employment</span>
                        <span class="font-bold text-dark text-sm text-right">Software Eng.<br><span class="text-xs font-normal text-muted">TechCorp Ltd (3 yrs)</span></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="absolute bottom-0 left-0 right-0 p-6 bg-surface border-t border-gray-100 flex gap-4 z-20 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
            <button class="flex-1 bg-danger/10 text-danger font-bold py-4 rounded-xl hover:bg-danger/20 transition-colors">
                Reject
            </button>
            <button class="flex-[2] bg-primary text-white font-bold py-4 rounded-xl hover:bg-primary/90 transition-colors shadow-lg shadow-primary/25">
                Approve Applicant
            </button>
        </div>
    </div>
</body>
</html>
