<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Properties - PropTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#1B4FD8', accent: '#10B981', background: '#F8FAFC', surface: '#FFFFFF', dark: '#0F172A', muted: '#64748B', danger: '#EF4444', warning: '#F59E0B' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="max-w-[390px] w-full h-[844px] bg-background relative shadow-2xl flex flex-col">
        <!-- Header -->
        <div class="bg-surface px-6 pt-14 pb-4 shadow-sm z-10 sticky top-0 flex justify-between items-center border-b border-gray-100">
            <h1 class="text-xl font-bold text-dark">Properties</h1>
            <button class="w-10 h-10 bg-primary/10 text-primary rounded-full flex items-center justify-center hover:bg-primary/20 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-6 py-6 space-y-4 pb-32">
            <!-- Search -->
            <div class="relative mb-2">
                <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                    <svg class="w-5 h-5 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" class="w-full pl-12 pr-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 text-sm text-dark placeholder-muted" placeholder="Search properties...">
            </div>

            <!-- Property List -->
            <!-- Property 1 -->
            <div class="bg-surface rounded-2xl p-4 shadow-sm border border-gray-100 flex gap-4 cursor-pointer hover:border-primary transition-colors">
                <div class="w-20 h-20 rounded-xl overflow-hidden shrink-0">
                    <img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Property" class="w-full h-full object-cover">
                </div>
                <div class="flex-1 flex flex-col justify-center">
                    <h3 class="font-bold text-dark text-sm mb-1 leading-tight">Lekki Gardens Estate</h3>
                    <div class="flex items-center gap-1 mb-2">
                        <svg class="w-3.5 h-3.5 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                        <p class="text-xs text-muted">Lekki Phase 1</p>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-dark">30 Units</span>
                        <span class="px-2 py-0.5 bg-danger/10 text-danger text-[10px] font-bold rounded">2 Vacant</span>
                    </div>
                </div>
            </div>

            <!-- Property 2 -->
            <div class="bg-surface rounded-2xl p-4 shadow-sm border border-gray-100 flex gap-4 cursor-pointer hover:border-primary transition-colors">
                <div class="w-20 h-20 rounded-xl overflow-hidden shrink-0">
                    <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Property" class="w-full h-full object-cover">
                </div>
                <div class="flex-1 flex flex-col justify-center">
                    <h3 class="font-bold text-dark text-sm mb-1 leading-tight">Victoria Island Heights</h3>
                    <div class="flex items-center gap-1 mb-2">
                        <svg class="w-3.5 h-3.5 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                        <p class="text-xs text-muted">Victoria Island</p>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-dark">15 Units</span>
                        <span class="px-2 py-0.5 bg-accent/10 text-accent text-[10px] font-bold rounded">Fully Occupied</span>
                    </div>
                </div>
            </div>
            
            <!-- Property 3 -->
            <div class="bg-surface rounded-2xl p-4 shadow-sm border border-gray-100 flex gap-4 cursor-pointer hover:border-primary transition-colors">
                <div class="w-20 h-20 rounded-xl bg-gray-100 flex items-center justify-center shrink-0 border border-gray-200">
                    <svg class="w-8 h-8 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                </div>
                <div class="flex-1 flex flex-col justify-center">
                    <h3 class="font-bold text-dark text-sm mb-1 leading-tight">Ikoyi Luxury Villas</h3>
                    <div class="flex items-center gap-1 mb-2">
                        <svg class="w-3.5 h-3.5 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                        <p class="text-xs text-muted">Ikoyi</p>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-dark">5 Units</span>
                        <span class="px-2 py-0.5 bg-danger/10 text-danger text-[10px] font-bold rounded">1 Vacant</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Admin Bottom Nav -->
        <div class="absolute bottom-0 left-0 right-0 bg-surface border-t border-gray-100 px-6 py-4 flex justify-between items-center rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.03)] pb-8 z-20">
            <button class="flex flex-col items-center gap-1 text-muted hover:text-dark transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                <span class="text-[10px] font-medium">Dash</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-primary">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a1 1 0 110 2h-3a1 1 0 01-1-1v-2a1 1 0 00-1-1H9a1 1 0 00-1 1v2a1 1 0 01-1 1H4a1 1 0 110-2V4zm3 1h2v2H7V5zm2 4H7v2h2V9zm2-4h2v2h-2V5zm2 4h-2v2h2V9z" clip-rule="evenodd"></path></svg>
                <span class="text-[10px] font-bold">Props</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-muted hover:text-dark transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span class="text-[10px] font-medium">Apps</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-muted hover:text-dark transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[10px] font-medium">Profile</span>
            </button>
        </div>
    </div>
</body>
</html>
