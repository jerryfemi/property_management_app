<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - PropTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#1B4FD8', accent: '#10B981', background: '#F8FAFC', surface: '#FFFFFF', dark: '#0F172A', muted: '#64748B', danger: '#EF4444', warning: '#F59E0B' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'); 
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="max-w-[390px] w-full h-[844px] bg-background relative shadow-2xl overflow-hidden flex flex-col">
        <!-- Header -->
        <div class="bg-surface px-6 pt-14 pb-4 rounded-b-3xl shadow-sm z-10 relative">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <p class="text-sm text-muted font-medium mb-1">Location</p>
                    <div class="flex items-center gap-2">
                        <h2 class="text-lg font-bold text-dark">Lagos, Nigeria</h2>
                        <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
                <div class="w-12 h-12 bg-gray-100 rounded-full overflow-hidden border-2 border-white shadow-sm">
                    <img src="https://ui-avatars.com/api/?name=Guest+User&background=1B4FD8&color=fff" alt="Profile" class="w-full h-full object-cover">
                </div>
            </div>
            
            <div class="flex gap-3">
                <div class="flex-1 relative">
                    <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" class="w-full pl-12 pr-4 py-3.5 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-primary/20 text-dark placeholder-muted" placeholder="Search properties...">
                </div>
                <button class="w-14 h-14 flex items-center justify-center bg-gray-50 rounded-2xl text-dark hover:bg-gray-100 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                </button>
            </div>
        </div>

        <!-- Chips -->
        <div class="px-6 py-5 flex gap-3 overflow-x-auto hide-scrollbar">
            <button class="px-5 py-2.5 bg-dark text-white rounded-full font-medium whitespace-nowrap text-sm shadow-md">All</button>
            <button class="px-5 py-2.5 bg-surface text-dark border border-gray-200 rounded-full font-medium whitespace-nowrap text-sm hover:border-primary transition-colors">Shortlet</button>
            <button class="px-5 py-2.5 bg-surface text-dark border border-gray-200 rounded-full font-medium whitespace-nowrap text-sm hover:border-primary transition-colors">1 Bed</button>
            <button class="px-5 py-2.5 bg-surface text-dark border border-gray-200 rounded-full font-medium whitespace-nowrap text-sm hover:border-primary transition-colors">2 Bed</button>
            <button class="px-5 py-2.5 bg-surface text-dark border border-gray-200 rounded-full font-medium whitespace-nowrap text-sm hover:border-primary transition-colors">Pool</button>
        </div>

        <!-- Property List -->
        <div class="flex-1 px-6 pb-24 overflow-y-auto space-y-6">
            <!-- Property Card 1 -->
            <div class="bg-surface rounded-[24px] p-3 shadow-sm hover:shadow-md transition-shadow cursor-pointer border border-gray-100 group">
                <div class="relative h-48 rounded-[16px] overflow-hidden mb-4">
                    <img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Property" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm px-3 py-1.5 rounded-full text-xs font-bold text-dark shadow-sm">
                        8 Units Available
                    </div>
                    <button class="absolute top-3 right-3 w-8 h-8 flex items-center justify-center bg-white/90 backdrop-blur-sm rounded-full text-muted hover:text-danger transition-colors shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                    </button>
                </div>
                <div class="px-1">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h3 class="font-bold text-lg text-dark leading-tight">Lekki Gardens Estate</h3>
                            <p class="text-muted text-sm flex items-center gap-1 mt-1">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                Lekki Phase 1, Lagos
                            </p>
                        </div>
                        <div class="flex items-center gap-1 bg-gray-50 px-2 py-1 rounded-lg">
                            <svg class="w-3.5 h-3.5 text-warning" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                            <span class="text-sm font-semibold text-dark">4.8</span>
                        </div>
                    </div>
                    <div class="flex items-end justify-between mt-4">
                        <div>
                            <span class="text-muted text-xs font-medium">Starting from</span>
                            <div class="text-primary font-bold text-xl">₦2.5M <span class="text-muted text-sm font-normal">/yr</span></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Property Card 2 -->
             <div class="bg-surface rounded-[24px] p-3 shadow-sm hover:shadow-md transition-shadow cursor-pointer border border-gray-100 group">
                <div class="relative h-48 rounded-[16px] overflow-hidden mb-4">
                    <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Property" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm px-3 py-1.5 rounded-full text-xs font-bold text-dark shadow-sm">
                        2 Units Available
                    </div>
                    <button class="absolute top-3 right-3 w-8 h-8 flex items-center justify-center bg-white/90 backdrop-blur-sm rounded-full text-muted hover:text-danger transition-colors shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                    </button>
                </div>
                <div class="px-1">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h3 class="font-bold text-lg text-dark leading-tight">Victoria Island Heights</h3>
                            <p class="text-muted text-sm flex items-center gap-1 mt-1">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                Victoria Island, Lagos
                            </p>
                        </div>
                        <div class="flex items-center gap-1 bg-gray-50 px-2 py-1 rounded-lg">
                            <svg class="w-3.5 h-3.5 text-warning" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                            <span class="text-sm font-semibold text-dark">4.9</span>
                        </div>
                    </div>
                    <div class="flex items-end justify-between mt-4">
                        <div>
                            <span class="text-muted text-xs font-medium">Starting from</span>
                            <div class="text-primary font-bold text-xl">₦4.2M <span class="text-muted text-sm font-normal">/yr</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="absolute bottom-0 left-0 right-0 bg-surface border-t border-gray-100 px-6 py-4 flex justify-between items-center rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.03)] pb-8">
            <button class="flex flex-col items-center gap-1 text-primary">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
                <span class="text-[10px] font-bold">Explore</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-muted hover:text-dark transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                <span class="text-[10px] font-medium">Saved</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-muted hover:text-dark transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span class="text-[10px] font-medium">Applications</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-muted hover:text-dark transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[10px] font-medium">Profile</span>
            </button>
        </div>
    </div>
</body>
</html>
