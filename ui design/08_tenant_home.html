<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Dashboard - PropTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#1B4FD8', accent: '#10B981', background: '#F8FAFC', surface: '#FFFFFF', dark: '#0F172A', muted: '#64748B', danger: '#EF4444', warning: '#F59E0B' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="max-w-[390px] w-full h-[844px] bg-background relative shadow-2xl flex flex-col">
        <!-- Header -->
        <div class="bg-primary px-6 pt-14 pb-8 rounded-b-[40px] text-white relative overflow-hidden flex-shrink-0 z-10 shadow-md">
            <div class="absolute top-0 left-0 w-full h-full bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9InJnYmEoMjU1LDI1NSwyNTUsMC4xKSIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiPjxwYXRoIGQ9Ik0zIDN2MThoMThWMyHegoiPjwvc3ZnPg==')] opacity-10"></div>
            <div class="flex justify-between items-center relative z-10 mb-6">
                <div>
                    <p class="text-primary-100 text-sm font-medium">Welcome back,</p>
                    <h1 class="text-2xl font-bold">Kemi O.</h1>
                </div>
                <button class="w-12 h-12 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center relative">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                    <span class="absolute top-3 right-3 w-2.5 h-2.5 bg-danger rounded-full border-2 border-primary"></span>
                </button>
            </div>
            
            <!-- Rent Status Card -->
            <div class="bg-white rounded-3xl p-5 text-dark shadow-xl relative z-10">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center gap-2">
                        <div class="w-2.5 h-2.5 bg-warning rounded-full animate-pulse"></div>
                        <span class="text-sm font-bold uppercase tracking-wider text-warning">Upcoming</span>
                    </div>
                    <span class="text-xs font-semibold text-muted">Due Oct 1</span>
                </div>
                <div class="mb-5">
                    <p class="text-xs font-medium text-muted mb-1">Next Rent Payment</p>
                    <h2 class="text-3xl font-black">₦2.5M</h2>
                </div>
                <button class="w-full bg-dark text-white font-bold py-3.5 rounded-xl hover:bg-black transition-colors flex justify-center items-center gap-2">
                    Pay Rent Now
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                </button>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto px-6 py-6 pb-8">
            <!-- Lease Info -->
            <div class="bg-surface rounded-2xl p-4 shadow-sm border border-gray-100 mb-6 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-accent/10 text-accent rounded-xl flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <div>
                        <h3 class="font-bold text-dark text-sm">Active Lease</h3>
                        <p class="text-xs text-muted">Unit 2A, Lekki Gardens</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-xs font-medium text-muted uppercase">Expires In</p>
                    <p class="font-bold text-dark">245 Days</p>
                </div>
            </div>

            <!-- Quick Actions -->
            <h3 class="font-bold text-dark mb-4 text-sm">Quick Actions</h3>
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-surface p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-start gap-3 hover:border-primary/50 cursor-pointer transition-colors group">
                    <div class="w-10 h-10 rounded-full bg-primary/10 text-primary flex items-center justify-center group-hover:bg-primary group-hover:text-white transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </div>
                    <span class="font-bold text-dark text-sm">Maintenance</span>
                </div>
                <div class="bg-surface p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-start gap-3 hover:border-primary/50 cursor-pointer transition-colors group">
                    <div class="w-10 h-10 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center group-hover:bg-purple-600 group-hover:text-white transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <span class="font-bold text-dark text-sm">View Contract</span>
                </div>
                <div class="bg-surface p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-start gap-3 hover:border-primary/50 cursor-pointer transition-colors group">
                    <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    </div>
                    <span class="font-bold text-dark text-sm">Message</span>
                </div>
                <div class="bg-surface p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-start gap-3 hover:border-primary/50 cursor-pointer transition-colors group">
                    <div class="w-10 h-10 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center group-hover:bg-orange-600 group-hover:text-white transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                    </div>
                    <span class="font-bold text-dark text-sm">Notice Board</span>
                </div>
            </div>
            
            <!-- Recent Activity -->
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-dark text-sm">Recent Activity</h3>
                <button class="text-primary text-xs font-bold uppercase">See All</button>
            </div>
            <div class="bg-surface rounded-2xl p-4 shadow-sm border border-gray-100 space-y-4">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-accent/10 flex items-center justify-center text-accent shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <div class="flex-1">
                        <p class="font-bold text-dark text-sm">Maintenance Resolved</p>
                        <p class="text-xs text-muted">Ticket #402: Leaking pipe fixed.</p>
                    </div>
                    <span class="text-[10px] font-medium text-muted">Yesterday</span>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="flex-shrink-0 bg-surface border-t border-gray-100 px-6 py-4 flex justify-between items-center rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.03)] pb-8 z-20">
            <button class="flex flex-col items-center gap-1 text-primary">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
                <span class="text-[10px] font-bold">Home</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-muted hover:text-dark transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                <span class="text-[10px] font-medium">Payments</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-muted hover:text-dark transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                <span class="text-[10px] font-medium">Tickets</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-muted hover:text-dark transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[10px] font-medium">Profile</span>
            </button>
        </div>
    </div>
</body>
</html>
