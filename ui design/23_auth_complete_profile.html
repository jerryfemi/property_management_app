<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auth: Complete Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        primary: '#1B4FD8', 
                        accent: '#10B981', 
                        background: '#F8FAFC', 
                        surface: '#FFFFFF', 
                        dark: '#0F172A', 
                        muted: '#64748B', 
                        danger: '#EF4444', 
                        warning: '#F59E0B' 
                    }, 
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'] 
                    } 
                } 
            } 
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        body { margin: 0; padding: 100px; background: #E5E7EB; display: flex; justify-content: center; font-family: 'Inter', sans-serif; }
        .device-wrapper { flex-shrink: 0; box-shadow: 0 50px 100px -20px rgba(0,0,0,0.3); border-radius: 40px; background: white; }
    </style>
</head>
<body>
    
<div class="device-wrapper relative overflow-hidden">
    <div class="max-w-[390px] w-full h-[844px] bg-surface relative shadow-2xl overflow-hidden flex flex-col">
        <!-- Main Content -->
        <div class="flex-1 px-6 pt-20 overflow-y-auto">
            <!-- Icon Header -->
            <div class="w-14 h-14 bg-primary/10 rounded-2xl flex items-center justify-center mb-8">
                <svg class="w-7 h-7 text-primary" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>

            <!-- Header Text -->
            <h1 class="text-3xl font-[900] text-dark leading-[1.15] mb-3">Complete your<br>profile</h1>
            <p class="text-muted text-base font-medium leading-relaxed mb-10">Just a couple more details and you're all set.</p>

            <!-- Form -->
            <div class="space-y-6">
                <div class="space-y-2">
                    <label class="text-sm font-bold text-dark">Full Name</label>
                    <input type="text" value="John Doe" class="w-full px-4 py-4 bg-background border border-gray-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-dark font-medium placeholder-muted" placeholder="John Doe">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-bold text-dark">Phone Number</label>
                    <input type="tel" class="w-full px-4 py-4 bg-background border border-gray-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-dark font-medium placeholder-muted" placeholder="+234 800 000 0000">
                </div>
            </div>
        </div>

        <!-- Bottom CTA -->
        <div class="p-6 pb-10 bg-surface border-t border-gray-50">
            <button class="w-full bg-primary text-white font-bold py-4 rounded-2xl hover:bg-primary/90 transition-all shadow-lg shadow-primary/25 active:scale-[0.98]">
                Save & Continue
            </button>
        </div>
    </div>
</div>

</body>
</html>
