<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - PropTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#1B4FD8', accent: '#10B981', background: '#F8FAFC', surface: '#FFFFFF', dark: '#0F172A', muted: '#64748B', danger: '#EF4444', warning: '#F59E0B' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="max-w-[390px] w-full h-[844px] bg-background relative shadow-2xl overflow-hidden flex flex-col">
        <!-- Header -->
        <div class="bg-dark px-6 pt-14 pb-6 rounded-b-[32px] text-white relative z-10">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <p class="text-gray-400 text-sm font-medium">Overview</p>
                    <h1 class="text-xl font-bold">Manager Dashboard</h1>
                </div>
                <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center relative">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                    <span class="absolute top-2 right-2 w-2 h-2 bg-danger rounded-full"></span>
                </div>
            </div>
            
            <div class="flex gap-4">
                <div class="flex-1 bg-white/10 p-4 rounded-2xl backdrop-blur-sm border border-white/5">
                    <p class="text-xs text-gray-300 mb-1 font-medium">Rent Collected</p>
                    <p class="text-xl font-bold">₦12.5M</p>
                    <p class="text-[10px] text-accent flex items-center gap-1 mt-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg> 14% vs last month</p>
                </div>
                <div class="flex-1 bg-white/10 p-4 rounded-2xl backdrop-blur-sm border border-white/5">
                    <p class="text-xs text-gray-300 mb-1 font-medium">Occupancy Rate</p>
                    <p class="text-xl font-bold">92%</p>
                    <p class="text-[10px] text-gray-400 mt-1">28/30 Units</p>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto px-6 py-6 pb-24">
            <!-- Action Items -->
            <h3 class="font-bold text-dark text-sm mb-4">Needs Attention</h3>
            <div class="space-y-3 mb-8">
                <!-- Action 1 -->
                <div class="bg-surface p-4 rounded-2xl shadow-sm border-l-4 border-l-warning flex items-center justify-between cursor-pointer hover:bg-gray-50">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-warning/10 text-warning flex items-center justify-center">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        </div>
                        <div>
                            <p class="font-bold text-dark text-sm">3 Pending Applications</p>
                            <p class="text-xs text-muted">Review required</p>
                        </div>
                    </div>
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </div>
                
                <!-- Action 2 -->
                <div class="bg-surface p-4 rounded-2xl shadow-sm border-l-4 border-l-danger flex items-center justify-between cursor-pointer hover:bg-gray-50">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-danger/10 text-danger flex items-center justify-center">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <div>
                            <p class="font-bold text-dark text-sm">2 Overdue Payments</p>
                            <p class="text-xs text-muted">Units 4B, 1A</p>
                        </div>
                    </div>
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </div>
            </div>

            <!-- Quick Links -->
            <h3 class="font-bold text-dark text-sm mb-4">Quick Links</h3>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-surface p-4 rounded-2xl border border-gray-100 shadow-sm flex flex-col gap-3">
                    <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center text-primary">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                    </div>
                    <div>
                        <p class="font-bold text-dark text-sm">Properties</p>
                        <p class="text-[10px] text-muted">Manage buildings</p>
                    </div>
                </div>
                <div class="bg-surface p-4 rounded-2xl border border-gray-100 shadow-sm flex flex-col gap-3">
                    <div class="w-10 h-10 bg-accent/10 rounded-full flex items-center justify-center text-accent">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    </div>
                    <div>
                        <p class="font-bold text-dark text-sm">Tenants</p>
                        <p class="text-[10px] text-muted">Directory & messages</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Admin Bottom Nav -->
        <div class="absolute bottom-0 left-0 right-0 bg-surface border-t border-gray-100 px-6 py-4 flex justify-between items-center rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.03)] pb-8 z-20">
            <button class="flex flex-col items-center gap-1 text-primary">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
                <span class="text-[10px] font-bold">Dash</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-muted hover:text-dark transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                <span class="text-[10px] font-medium">Props</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-muted hover:text-dark transition-colors relative">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span class="absolute -top-1 -right-1 w-3 h-3 bg-warning rounded-full border-2 border-surface"></span>
                <span class="text-[10px] font-medium">Apps</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-muted hover:text-dark transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[10px] font-medium">Profile</span>
            </button>
        </div>
    </div>
</body>
</html>
