<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Status - PropTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#1B4FD8', accent: '#10B981', background: '#F8FAFC', surface: '#FFFFFF', dark: '#0F172A', muted: '#64748B', danger: '#EF4444', warning: '#F59E0B' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="max-w-[390px] w-full h-[844px] bg-background relative shadow-2xl flex flex-col">
        <!-- Header -->
        <div class="bg-surface px-6 pt-14 pb-4 shadow-sm relative z-10 flex items-center justify-between">
            <h1 class="text-xl font-bold text-dark">Application Status</h1>
            <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors">
                <svg class="w-6 h-6 text-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-6 py-6 space-y-6">
            <!-- Status Card -->
            <div class="bg-surface rounded-3xl p-6 shadow-sm border border-warning/20 relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-warning/5 rounded-full blur-2xl"></div>
                <div class="flex flex-col items-center text-center relative z-10">
                    <div class="w-20 h-20 bg-warning/10 rounded-full flex items-center justify-center mb-4 relative">
                        <div class="absolute inset-0 bg-warning/20 rounded-full animate-ping opacity-50"></div>
                        <svg class="w-10 h-10 text-warning" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h2 class="text-2xl font-bold text-dark mb-2">Under Review</h2>
                    <p class="text-sm text-muted">Your application has been received and is currently being reviewed by the property manager.</p>
                </div>
            </div>

            <!-- Property Card -->
            <div class="bg-surface rounded-2xl p-4 shadow-sm border border-gray-100 flex gap-4 items-center">
                <div class="w-20 h-20 rounded-xl overflow-hidden shrink-0">
                    <img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Property" class="w-full h-full object-cover">
                </div>
                <div class="flex-1">
                    <p class="text-xs font-bold text-primary mb-1 uppercase tracking-wider">Unit 2A</p>
                    <h3 class="font-bold text-dark leading-tight mb-1">Lekki Gardens Estate</h3>
                    <p class="text-sm font-medium text-dark">₦2.5M <span class="text-xs text-muted font-normal">/yr</span></p>
                </div>
                <div class="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center shrink-0">
                    <svg class="w-5 h-5 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </div>
            </div>

            <!-- Timeline -->
            <div class="bg-surface rounded-3xl p-6 shadow-sm border border-gray-100">
                <h3 class="font-bold text-dark mb-6">Application Timeline</h3>
                
                <div class="space-y-6 relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px before:h-full before:w-0.5 before:bg-gray-200">
                    <!-- Step 1: Completed -->
                    <div class="relative flex items-center group is-active">
                        <div class="flex items-center justify-center w-10 h-10 rounded-full border-2 border-accent bg-accent text-white shadow shrink-0 z-10">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <div class="w-[calc(100%-4rem)] pl-4">
                            <div class="flex flex-col">
                                <span class="font-bold text-dark">Application Submitted</span>
                                <span class="text-xs text-muted">Today, 10:24 AM</span>
                            </div>
                        </div>
                    </div>

                    <!-- Step 2: Current -->
                    <div class="relative flex items-center group is-active">
                        <div class="flex items-center justify-center w-10 h-10 rounded-full border-4 border-warning/20 bg-warning text-white shadow shrink-0 z-10 ring-4 ring-warning/10">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </div>
                        <div class="w-[calc(100%-4rem)] pl-4">
                            <div class="flex flex-col">
                                <span class="font-bold text-dark text-warning">Under Review</span>
                                <span class="text-xs text-muted">Usually takes 24-48 hours</span>
                            </div>
                        </div>
                    </div>

                    <!-- Step 3: Pending -->
                    <div class="relative flex items-center group is-active">
                        <div class="flex items-center justify-center w-10 h-10 rounded-full border-2 border-gray-200 bg-white text-gray-400 shadow shrink-0 z-10">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <div class="w-[calc(100%-4rem)] pl-4">
                            <div class="flex flex-col">
                                <span class="font-medium text-gray-400">Final Decision</span>
                                <span class="text-xs text-gray-400">Pending</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <button class="w-full bg-surface text-dark font-semibold py-4 rounded-xl border border-gray-200 hover:bg-gray-50 transition-colors shadow-sm mt-4">
                Withdraw Application
            </button>
        </div>
    </div>
</body>
</html>
