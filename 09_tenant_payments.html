<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Payments - PropTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#1B4FD8', accent: '#10B981', background: '#F8FAFC', surface: '#FFFFFF', dark: '#0F172A', muted: '#64748B', danger: '#EF4444', warning: '#F59E0B' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="max-w-[390px] w-full h-[844px] bg-background relative shadow-2xl flex flex-col">
        <!-- Header -->
        <div class="bg-surface px-6 pt-14 pb-4 shadow-sm z-10 sticky top-0">
            <h1 class="text-2xl font-bold text-dark">Payments</h1>
        </div>

        <div class="flex-1 overflow-y-auto px-6 py-6 space-y-8 pb-32">
            <!-- Payment Action -->
            <div class="bg-surface rounded-3xl p-6 shadow-sm border border-gray-100 flex flex-col items-center text-center">
                <div class="w-16 h-16 bg-primary/10 text-primary rounded-full flex items-center justify-center mb-4">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h2 class="text-sm font-medium text-muted uppercase tracking-wide mb-1">Total Balance Due</h2>
                <p class="text-4xl font-black text-dark mb-6">₦2,500,000</p>
                <button class="w-full bg-accent text-white font-bold py-4 rounded-xl hover:bg-accent/90 transition-colors shadow-lg shadow-accent/25 flex items-center justify-center gap-2">
                    Pay Now
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>

            <!-- Transaction History -->
            <div>
                <h3 class="font-bold text-dark mb-4">Transaction History</h3>
                <div class="space-y-3">
                    <!-- Tx 1 -->
                    <div class="bg-surface p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between hover:border-gray-200 transition-colors cursor-pointer">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-accent/10 flex items-center justify-center text-accent">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <div>
                                <h4 class="font-bold text-dark text-sm">Annual Rent</h4>
                                <p class="text-xs text-muted font-medium">Oct 1, 2024</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-dark text-sm">₦2,500,000</p>
                            <p class="text-[10px] font-bold text-accent bg-accent/10 px-2 py-0.5 rounded inline-block uppercase mt-1">Cleared</p>
                        </div>
                    </div>

                    <!-- Tx 2 -->
                    <div class="bg-surface p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between hover:border-gray-200 transition-colors cursor-pointer">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-gray-100 flex items-center justify-center text-dark">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                            </div>
                            <div>
                                <h4 class="font-bold text-dark text-sm">Maintenance Fee</h4>
                                <p class="text-xs text-muted font-medium">Sep 15, 2024</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-dark text-sm">₦50,000</p>
                            <p class="text-[10px] font-bold text-accent bg-accent/10 px-2 py-0.5 rounded inline-block uppercase mt-1">Cleared</p>
                        </div>
                    </div>

                    <!-- Tx 3 -->
                    <div class="bg-surface p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between hover:border-gray-200 transition-colors cursor-pointer opacity-70">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-gray-100 flex items-center justify-center text-dark">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            </div>
                            <div>
                                <h4 class="font-bold text-dark text-sm">Agreement Fee</h4>
                                <p class="text-xs text-muted font-medium">Oct 1, 2023</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-dark text-sm">₦250,000</p>
                            <p class="text-[10px] font-bold text-accent bg-accent/10 px-2 py-0.5 rounded inline-block uppercase mt-1">Cleared</p>
                        </div>
                    </div>
                </div>
                <button class="w-full mt-4 text-primary font-bold text-sm hover:underline">Download All Statements</button>
            </div>
        </div>

        <!-- Bottom Navigation (Same as home, payments active) -->
        <div class="absolute bottom-0 left-0 right-0 bg-surface border-t border-gray-100 px-6 py-4 flex justify-between items-center rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.03)] pb-8">
            <button class="flex flex-col items-center gap-1 text-muted hover:text-dark transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-[10px] font-medium">Home</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-primary">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path></svg>
                <span class="text-[10px] font-bold">Payments</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-muted hover:text-dark transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                <span class="text-[10px] font-medium">Tickets</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-muted hover:text-dark transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[10px] font-medium">Profile</span>
            </button>
        </div>
    </div>
</body>
</html>
