<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Lease - PropTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#1B4FD8', accent: '#10B981', background: '#F8FAFC', surface: '#FFFFFF', dark: '#0F172A', muted: '#64748B', danger: '#EF4444', warning: '#F59E0B' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-8">
    <div class="max-w-[1440px] w-full min-h-[900px] bg-background rounded-3xl shadow-2xl flex overflow-hidden border border-gray-200">
        <!-- Sidebar context -->
        <div class="w-64 bg-dark text-white flex flex-col shrink-0">
             <div class="p-6 flex items-center gap-3 mb-6">
                <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg></div>
                <span class="text-xl font-bold tracking-tight">PropTech</span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-w-0 bg-background relative">
            <header class="h-20 bg-surface border-b border-gray-200 flex items-center px-8 shrink-0">
                <button class="flex items-center gap-2 text-muted hover:text-dark font-medium transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to Applications
                </button>
            </header>

            <main class="flex-1 overflow-y-auto p-8 flex justify-center">
                <div class="max-w-3xl w-full">
                    <div class="mb-8">
                        <h1 class="text-3xl font-bold text-dark mb-2">Create Lease Agreement</h1>
                        <p class="text-muted">Convert approved applicant <span class="font-bold text-dark">Kemi Olayinka</span> into a tenant for <span class="font-bold text-dark">Unit 2A</span>.</p>
                    </div>

                    <div class="bg-surface rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        <div class="p-8 space-y-8">
                            <!-- Lease Terms -->
                            <div>
                                <h2 class="text-lg font-bold text-dark mb-4 border-b border-gray-100 pb-2">Lease Terms</h2>
                                <div class="grid grid-cols-2 gap-6">
                                    <div class="space-y-2">
                                        <label class="text-sm font-semibold text-dark">Start Date</label>
                                        <input type="date" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:bg-white text-dark">
                                    </div>
                                    <div class="space-y-2">
                                        <label class="text-sm font-semibold text-dark">End Date</label>
                                        <input type="date" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:bg-white text-dark">
                                    </div>
                                    <div class="space-y-2 col-span-2">
                                        <label class="text-sm font-semibold text-dark">Billing Frequency</label>
                                        <select class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:bg-white text-dark">
                                            <option>Annually</option>
                                            <option>Bi-Annually</option>
                                            <option>Quarterly</option>
                                            <option>Monthly</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- Financial Breakdown -->
                            <div>
                                <h2 class="text-lg font-bold text-dark mb-4 border-b border-gray-100 pb-2">Financial Breakdown (Initial Invoice)</h2>
                                <div class="space-y-4">
                                    <div class="flex items-center gap-4">
                                        <div class="flex-1 space-y-1">
                                            <label class="text-sm font-medium text-dark">Base Rent</label>
                                        </div>
                                        <div class="w-64 relative">
                                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-muted font-medium">₦</span>
                                            <input type="text" value="2,500,000" class="w-full pl-8 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-right font-medium text-dark focus:ring-2 focus:ring-primary/20">
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-4">
                                        <div class="flex-1 space-y-1">
                                            <label class="text-sm font-medium text-dark">Caution Deposit <span class="text-xs text-muted font-normal">(Refundable)</span></label>
                                        </div>
                                        <div class="w-64 relative">
                                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-muted font-medium">₦</span>
                                            <input type="text" value="250,000" class="w-full pl-8 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-right font-medium text-dark focus:ring-2 focus:ring-primary/20">
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-4">
                                        <div class="flex-1 space-y-1">
                                            <label class="text-sm font-medium text-dark">Agency Fee <span class="text-xs text-muted font-normal">(10%)</span></label>
                                        </div>
                                        <div class="w-64 relative">
                                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-muted font-medium">₦</span>
                                            <input type="text" value="250,000" class="w-full pl-8 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-right font-medium text-dark focus:ring-2 focus:ring-primary/20">
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-4">
                                        <div class="flex-1 space-y-1">
                                            <label class="text-sm font-medium text-dark">Legal/Agreement Fee <span class="text-xs text-muted font-normal">(10%)</span></label>
                                        </div>
                                        <div class="w-64 relative">
                                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-muted font-medium">₦</span>
                                            <input type="text" value="250,000" class="w-full pl-8 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-right font-medium text-dark focus:ring-2 focus:ring-primary/20">
                                        </div>
                                    </div>
                                    <div class="h-px bg-gray-200 my-2"></div>
                                    <div class="flex items-center justify-between bg-primary/5 p-4 rounded-xl border border-primary/20">
                                        <span class="font-bold text-dark">Total Initial Payment Due</span>
                                        <span class="text-2xl font-black text-primary">₦3,250,000</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Document Upload -->
                            <div>
                                <h2 class="text-lg font-bold text-dark mb-4 border-b border-gray-100 pb-2">Signed Contract</h2>
                                <div class="border-2 border-dashed border-gray-300 bg-gray-50 rounded-2xl p-10 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-white hover:border-primary transition-colors group">
                                    <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-4 shadow-sm group-hover:scale-110 transition-transform">
                                        <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                    </div>
                                    <h3 class="font-bold text-dark mb-1">Upload Signed PDF Contract</h3>
                                    <p class="text-sm text-muted">Drag and drop or click to browse</p>
                                </div>
                            </div>
                        </div>

                        <div class="p-6 border-t border-gray-100 bg-gray-50 flex justify-end gap-4">
                            <button class="px-6 py-3 border border-gray-300 text-dark font-bold rounded-xl hover:bg-white transition-colors">Cancel</button>
                            <button class="px-8 py-3 bg-primary text-white font-bold rounded-xl hover:bg-primary/90 transition-colors shadow-lg shadow-primary/30 flex items-center gap-2">
                                Generate Invoice & Create Lease
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
