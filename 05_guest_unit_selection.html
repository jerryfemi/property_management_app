<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Selection - PropTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#1B4FD8', accent: '#10B981', background: '#F8FAFC', surface: '#FFFFFF', dark: '#0F172A', muted: '#64748B', danger: '#EF4444', warning: '#F59E0B' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="max-w-[390px] w-full h-[844px] bg-background relative shadow-2xl flex flex-col">
        <!-- Header -->
        <div class="bg-surface px-6 pt-12 pb-4 flex items-center justify-between z-20 border-b border-gray-100 flex-shrink-0">
            <div class="flex items-center gap-4">
                <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors">
                    <svg class="w-6 h-6 text-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <div>
                    <h1 class="text-lg font-bold text-dark">1 Bedroom Units</h1>
                    <p class="text-xs text-muted">Lekki Gardens Estate</p>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto px-6 py-6 pb-8">
            <!-- Floor Plan -->
            <div class="bg-surface rounded-2xl p-4 shadow-sm border border-gray-100 mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-dark text-sm">Floor Plan</h2>
                    <button class="text-primary text-xs font-bold uppercase tracking-wider">Expand</button>
                </div>
                <div class="bg-gray-50 rounded-xl h-48 flex items-center justify-center border border-gray-200 border-dashed">
                    <!-- Placeholder for floor plan image -->
                    <svg class="w-16 h-16 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 4h16v16H4V4zm4 0v16m8-16v16M4 12h16m-8-8v16"></path></svg>
                </div>
                <div class="flex justify-around mt-4">
                    <div class="text-center">
                        <p class="text-xl font-bold text-dark">450</p>
                        <p class="text-xs font-medium text-muted uppercase">Sqft</p>
                    </div>
                    <div class="w-px bg-gray-200"></div>
                    <div class="text-center">
                        <p class="text-xl font-bold text-dark">1</p>
                        <p class="text-xs font-medium text-muted uppercase">Bed</p>
                    </div>
                    <div class="w-px bg-gray-200"></div>
                    <div class="text-center">
                        <p class="text-xl font-bold text-dark">1</p>
                        <p class="text-xs font-medium text-muted uppercase">Bath</p>
                    </div>
                </div>
            </div>

            <h3 class="font-bold text-dark text-sm mb-4">Select a specific unit</h3>
            <div class="space-y-4">
                <!-- Unit Option 1 -->
                <label class="block relative cursor-pointer group">
                    <input type="radio" name="unit" class="peer sr-only" checked>
                    <div class="p-4 bg-surface rounded-2xl border-2 border-primary ring-4 ring-primary/10 transition-all">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-primary/10 text-primary rounded-xl flex items-center justify-center font-bold text-lg">2A</div>
                                <div>
                                    <h4 class="font-bold text-dark">Unit 2A</h4>
                                    <p class="text-xs text-muted">2nd Floor • North Facing</p>
                                </div>
                            </div>
                            <div class="w-5 h-5 rounded-full border-2 border-primary flex items-center justify-center">
                                <div class="w-2.5 h-2.5 bg-primary rounded-full"></div>
                            </div>
                        </div>
                        <div class="mt-4 flex items-center justify-between border-t border-gray-100 pt-3">
                            <div class="flex gap-2">
                                <span class="px-2 py-1 bg-gray-100 rounded text-xs font-medium text-dark">Balcony</span>
                                <span class="px-2 py-1 bg-gray-100 rounded text-xs font-medium text-dark">Corner</span>
                            </div>
                            <span class="font-bold text-primary">₦2.5M</span>
                        </div>
                    </div>
                </label>

                <!-- Unit Option 2 -->
                <label class="block relative cursor-pointer group">
                    <input type="radio" name="unit" class="peer sr-only">
                    <div class="p-4 bg-surface rounded-2xl border-2 border-gray-100 hover:border-gray-200 transition-all">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-gray-100 text-dark rounded-xl flex items-center justify-center font-bold text-lg">3B</div>
                                <div>
                                    <h4 class="font-bold text-dark">Unit 3B</h4>
                                    <p class="text-xs text-muted">3rd Floor • South Facing</p>
                                </div>
                            </div>
                            <div class="w-5 h-5 rounded-full border-2 border-gray-300 peer-checked:border-primary flex items-center justify-center">
                                <div class="w-2.5 h-2.5 bg-primary rounded-full"></div>
                            </div>
                        </div>
                        <div class="mt-4 flex items-center justify-between border-t border-gray-100 pt-3">
                            <div class="flex gap-2">
                                <span class="px-2 py-1 bg-gray-100 rounded text-xs font-medium text-dark">Pool View</span>
                            </div>
                            <span class="font-bold text-dark">₦2.6M</span>
                        </div>
                    </div>
                </label>
                
                <!-- Unit Option 3 -->
                <label class="block relative cursor-pointer group">
                    <input type="radio" name="unit" class="peer sr-only">
                    <div class="p-4 bg-surface rounded-2xl border-2 border-gray-100 hover:border-gray-200 transition-all">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-gray-100 text-dark rounded-xl flex items-center justify-center font-bold text-lg">4A</div>
                                <div>
                                    <h4 class="font-bold text-dark">Unit 4A</h4>
                                    <p class="text-xs text-muted">4th Floor • Top Floor</p>
                                </div>
                            </div>
                            <div class="w-5 h-5 rounded-full border-2 border-gray-300 peer-checked:border-primary flex items-center justify-center">
                                <div class="w-2.5 h-2.5 bg-primary rounded-full"></div>
                            </div>
                        </div>
                        <div class="mt-4 flex items-center justify-between border-t border-gray-100 pt-3">
                            <div class="flex gap-2">
                                <span class="px-2 py-1 bg-gray-100 rounded text-xs font-medium text-dark">High Ceiling</span>
                            </div>
                            <span class="font-bold text-dark">₦2.7M</span>
                        </div>
                    </div>
                </label>
            </div>
        </div>

        <!-- Sticky Bottom Bar -->
        <div class="flex-shrink-0 p-6 bg-surface border-t border-gray-100 z-20 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
            <div class="flex justify-between items-center mb-4">
                <span class="text-muted font-medium text-sm">Selected Unit: 2A</span>
                <span class="text-dark font-bold text-lg">₦2.5M <span class="text-muted font-normal text-sm">Base Rent</span></span>
            </div>
            <button class="w-full bg-primary text-white font-bold py-4 rounded-xl hover:bg-primary/90 transition-colors shadow-lg shadow-primary/25">
                Apply Now
            </button>
        </div>
    </div>
</body>
</html>
